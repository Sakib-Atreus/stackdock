# Local development database only. The app itself runs with `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: stackdock-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stackdock
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - stackdock-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stackdock']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stackdock-pgdata:
